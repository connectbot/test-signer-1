# Install as .github/workflows/android-build-reusable.yml.
# Pin/review workflow contents in signer policy after adapting JDK/SDK/tasks.
name: Trusted reusable Android builder
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Provision a pinned JDK/Android SDK here. No shared release caches.
      - run: ./gradlew --no-build-cache --no-configuration-cache :app:assembleRelease :app:bundleRelease
      - run: |
          mkdir unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned/app.apk
          cp app/build/outputs/bundle/release/app-release.aab unsigned/app.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-default-${{ github.run_attempt }}
          path: unsigned/
          if-no-files-found: error
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-default-${{ github.run_attempt }}
          path: unsigned/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            unsigned/app.apk
            unsigned/app.aab
          create-storage-record: false
