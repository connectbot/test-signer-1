# Example only. Choose a free VM ID, node/bridge/MAC, and versioned host paths.
# Start a sandboxed virtiofsd exporting /protected/android-signer read-only at
# /run/android-signer/fs.sock before starting this VM.
name: android-signer
ostype: other
bios: seabios
machine: pc
cpu: host
cores: 1
sockets: 1
memory: 2048
balloon: 0
numa: 0
hotplug: 0
agent: 0
serial0: socket
vga: serial0
net0: virtio=02:00:00:00:00:01,bridge=vmbr0,firewall=1
args: -kernel /opt/android-signer/hermit-loader -initrd /opt/android-signer/signer -chardev socket,id=signerfs,path=/run/android-signer/fs.sock -device vhost-user-fs-pci,chardev=signerfs,tag=root -object memory-backend-memfd,id=signerram,size=2048M,share=on -numa node,memdev=signerram
