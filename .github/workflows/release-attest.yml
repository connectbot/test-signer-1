name: Verify and attest signed Android release
on:
  workflow_call:
    inputs:
      source_run:
        type: number
        required: true
      source_attempt:
        type: number
        required: true
    outputs:
      artifact_id:
        description: Immutable verified publishing handoff
        value: ${{ jobs.attest.outputs.artifact_id }}
      manifest_sha256:
        description: SHA-256 of the attested release manifest
        value: ${{ jobs.attest.outputs.manifest_sha256 }}
permissions:
  contents: read
concurrency:
  group: signer-finalize-${{ inputs.source_run }}-${{ inputs.source_attempt }}
  cancel-in-progress: false
jobs:
  attest:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      # The dispatched SHA is the trusted default-branch finalizer, not the
      # Android source commit. Never check out or execute the triggering build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '25'
      - name: Verify both signing transactions
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: |
          python3 .github/scripts/signer-publish.py prepare \
            --source-run "$SOURCE_RUN" --source-attempt "$SOURCE_ATTEMPT" \
            --policy .github/signer-policy.json \
            --out "$RUNNER_TEMP/verified-release" --tools "$RUNNER_TEMP/reference-tools"
      - name: Attest final signed files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/verified-release/oss/app-signed.apk
            ${{ runner.temp }}/verified-release/oss/app-signed.aab
            ${{ runner.temp }}/verified-release/google/app-signed.apk
            ${{ runner.temp }}/verified-release/google/app-signed.aab
            ${{ runner.temp }}/verified-release/publish/*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/verified-release/predicate.json
          create-storage-record: false
      - name: Prepare verified draft
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          python3 .github/scripts/signer-publish.py seal \
            --out "$RUNNER_TEMP/verified-release" --bundle "$BUNDLE"
      - name: Preserve immutable publishing handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-publishing-${{ inputs.source_run }}-${{ inputs.source_attempt }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release/publish/
          if-no-files-found: error
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-verification-${{ inputs.source_run }}-${{ inputs.source_attempt }}
          path: |
            ${{ runner.temp }}/verified-release/verification.json
            ${{ runner.temp }}/verified-release/predicate.json
            ${{ runner.temp }}/verified-release/final.sigstore.json
          if-no-files-found: warn
