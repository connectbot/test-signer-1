# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: android-signer-backend
spec:
  endpoints:
    - fqdn:
        hostname: ${ANDROID_SIGNER_BACKEND_HOST}
        port: 443
  tls:
    sni: android-signer.internal
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: android-signer-ca
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: android-signer-webhook
  annotations:
    gatus.home-operations.com/enabled: 'false'
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - signer.${SECRET_DOMAIN}
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /webhooks/github
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: android-signer-backend
          port: 443
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: android-signer-internal
  annotations:
    external-dns.kubernetes.io/controller: none
    gatus.home-operations.com/enabled: 'false'
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - signer.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
        - path:
            type: Exact
            value: /readyz
        - method: POST
          path:
            type: Exact
            value: /webhooks/github
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: android-signer-backend
          port: 443
