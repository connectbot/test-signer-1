name: Publish verified Android release
on:
  workflow_call:
    inputs:
      artifact_id:
        type: string
        required: true
      manifest_sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  github:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-github-${{ github.repository_id }}-${{ inputs.manifest_sha256 }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/publish
          merge-multiple: true
      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python3 .github/scripts/signer-publish.py github \
            --out "$RUNNER_TEMP/publish" --manifest-sha256 "$MANIFEST_SHA256" \
            --report "$RUNNER_TEMP/github-publication.json"
      - name: Preserve publication result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-publication.json
          if-no-files-found: error
  play:
    if: ${{ vars.PLAY_ALPHA_ENABLED == 'true' && github.repository == 'connectbot/connectbot' && github.repository_id == '123235' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: play-alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-play-org-connectbot-alpha
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/publish
          merge-multiple: true
      - name: Verify publishing handoff before Google authentication
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python3 .github/scripts/signer-publish.py verify \
            --out "$RUNNER_TEMP/publish" --manifest-sha256 "$MANIFEST_SHA256"
      - name: Obtain short-lived Play credentials
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: api-4664730880327298161-873945
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish verified Google bundle to alpha
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python3 .github/scripts/signer-publish.py play \
            --out "$RUNNER_TEMP/publish" --manifest-sha256 "$MANIFEST_SHA256" \
            --report "$RUNNER_TEMP/play-publication.json"
      - name: Preserve publication result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/play-publication.json
          if-no-files-found: error
