name: Finalize signed Android release
on:
  workflow_run:
    workflows: [Continuous Integration, Continuous Integration (tags)]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful source build run ID
        type: string
        required: true
      source_attempt:
        description: Source build attempt
        type: string
        default: '1'
        required: true
permissions:
  contents: read
jobs:
  finalize:
    if: ${{ vars.ANDROID_SIGNER_ENABLED == 'true' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.id == github.event.repository.id) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    uses: ./.github/workflows/release-attest.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      source_run: ${{ github.event.workflow_run.id || fromJSON(inputs.source_run) }}
      source_attempt: ${{ github.event.workflow_run.run_attempt || fromJSON(inputs.source_attempt) }}
